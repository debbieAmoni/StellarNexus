name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  # ============ Contract Tests ============
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contracts/stellar_nexus

      - name: Run contract tests
        working-directory: contracts/stellar_nexus
        run: cargo test --all

      - name: Build WASM
        working-directory: contracts/stellar_nexus
        run: cargo build --target wasm32-unknown-unknown --release

  # ============ Contract Linting ============
  contract-lint:
    name: Contract Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: contracts/stellar_nexus
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: contracts/stellar_nexus
        run: cargo clippy -- -D warnings

  # ============ Frontend Tests ============
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

  # ============ Security Checks ============
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ============ Deploy to Testnet ============
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [contract-tests, contract-lint, frontend-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          curl -o stellar https://github.com/stellar/stellar-cli/releases/download/v21.0.0/stellar-linux-amd64
          chmod +x stellar
          sudo mv stellar /usr/local/bin/

      - name: Build contract
        working-directory: contracts/stellar_nexus
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --release

      - name: Deploy contract to testnet
        env:
          STELLAR_ACCOUNT: ${{ secrets.STELLAR_TESTNET_ACCOUNT }}
          STELLAR_SEED: ${{ secrets.STELLAR_TESTNET_SEED }}
        run: |
          stellar contract deploy \
            --wasm contracts/stellar_nexus/target/wasm32-unknown-unknown/release/stellar_nexus.wasm \
            --network testnet \
            > testnet-contract-id.txt

      - name: Store testnet contract ID
        uses: actions/upload-artifact@v3
        with:
          name: testnet-contract-id
          path: testnet-contract-id.txt

  # ============ Build Docker Image ============
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stellarnexus:latest
            ${{ secrets.DOCKER_USERNAME }}/stellarnexus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ Deploy to Production ============
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://stellarnexus.io
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend

      - name: Notify deployment
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployed to production at https://stellarnexus.io'
            })
