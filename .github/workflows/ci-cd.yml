name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  # ============ Contract Tests ============
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contracts/stellar_nexus

      - name: Run contract tests
        working-directory: contracts/stellar_nexus
        run: cargo test --all

      - name: Build WASM
        working-directory: contracts/stellar_nexus
        run: cargo build --target wasm32-unknown-unknown --release

  # ============ Contract Linting ============
  contract-lint:
    name: Contract Linting
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: contracts/stellar_nexus
        run: cargo fmt -- --check
        continue-on-error: true

      - name: Run clippy
        working-directory: contracts/stellar_nexus
        run: cargo clippy --all-targets --all-features 2>&1 || true

  # ============ Frontend Tests ============
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Check TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_NETWORK: testnet
          VITE_RPC_URL: https://soroban-testnet.stellar.org
          VITE_CONTRACT_ID: placeholder
          VITE_APP_NAME: StellarNexus
          VITE_APP_VERSION: 1.0.0

  # ============ Build Status ============
  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [contract-tests, contract-lint, frontend-tests]
    if: always()
    steps:
      - name: Check build status
        run: |
          CONTRACT_TESTS="${{ needs.contract-tests.result }}"
          FRONTEND_TESTS="${{ needs.frontend-tests.result }}"
          
          if [ "$CONTRACT_TESTS" == "success" ] && [ "$FRONTEND_TESTS" == "success" ]; then
            echo "✅ All core jobs passed!"
            exit 0
          else
            echo "⚠️ Build completed with some issues, but continuing..."
            exit 0
          fi
