name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  # ============ Contract Tests ============
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contracts/stellar_nexus

      - name: Run contract tests
        working-directory: contracts/stellar_nexus
        run: cargo test --all

      - name: Build WASM
        working-directory: contracts/stellar_nexus
        run: cargo build --target wasm32-unknown-unknown --release

  # ============ Contract Linting ============
  contract-lint:
    name: Contract Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: contracts/stellar_nexus
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: contracts/stellar_nexus
        run: cargo clippy -- -D warnings

  # ============ Frontend Tests ============
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Check TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_NETWORK: testnet
          VITE_RPC_URL: https://soroban-testnet.stellar.org
          VITE_CONTRACT_ID: placeholder
          VITE_APP_NAME: StellarNexus
          VITE_APP_VERSION: 1.0.0

  # ============ Security Checks ============
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ============ Deploy to Testnet (Optional) ============
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [contract-tests, contract-lint, frontend-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' && github.repository_owner == 'debbieAmoni'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Testnet deployment requires manual setup
        run: echo "To deploy to testnet, run: ./deploy.sh testnet with proper Stellar credentials"

  # ============ Build Docker Image (Optional) ============
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'debbieAmoni'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: stellarnexus:latest

  # ============ Deploy to Production (Optional) ============
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'debbieAmoni'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Ready for manual Vercel deployment
        run: echo "Frontend is built and ready for Vercel deployment at https://vercel.com"
